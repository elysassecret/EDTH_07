name: smoke
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest]  # one runner while the org spending limit blocks jobs (#74); add macos/windows back when billing is restored
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q tests/smoke
